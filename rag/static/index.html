<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Tu Archivo</title>
  <link rel="icon" href="/static/logo.png">
  <!-- Dependencias locales: la app es 100% privada y funciona sin internet -->
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>

  <style>
    /* ---------- Tokens ---------- */
    :root {
      --bg: #fbfbfd;
      --bg-elevated: #ffffff;
      --sidebar: #f2f2f5;
      --label: #1d1d1f;
      --label-2: rgba(60, 60, 67, 0.75);
      --label-3: rgba(60, 60, 67, 0.48);
      --separator: rgba(60, 60, 67, 0.14);
      --fill: rgba(120, 120, 128, 0.12);
      --fill-2: rgba(120, 120, 128, 0.07);
      --accent: #0071e3;
      --accent-pressed: #0062c4;
      --accent-tint: rgba(0, 113, 227, 0.11);
      --selection: #0071e3;
      --on-accent: #ffffff;
      --danger: #e5352b;
      --code-bg: #f5f5f7;
      --material: rgba(251, 251, 253, 0.72);
      --material-float: rgba(255, 255, 255, 0.7);
      --material-edge: rgba(255, 255, 255, 0.7);
      --scrim: rgba(0, 0, 0, 0.22);
      --shadow-float: 0 10px 34px rgba(0, 0, 0, 0.09), 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-chip: 0 1px 2px rgba(0, 0, 0, 0.06);

      --font: system-ui, -apple-system, "SF Pro Text", "Segoe UI", "Adwaita Sans", "Inter", "Cantarell", sans-serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, monospace;

      --radius-l: 20px;
      --radius-m: 12px;
      --radius-s: 8px;
      --sidebar-w: 17.5rem;
      --content-w: 46rem;

      /* Resorte críticamente amortiguado (damping 1.0, response 0.35 s) */
      --spring: linear(0, 0.081, 0.243, 0.412, 0.561, 0.681, 0.773, 0.841, 0.89, 0.924, 0.948, 0.965, 0.977, 0.984, 0.99, 0.993, 0.995, 0.997, 1);
      --spring-dur: 470ms;
      --press: 90ms;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161617;
        --bg-elevated: #1d1d1f;
        --sidebar: #1c1c1e;
        --label: #f5f5f7;
        --label-2: rgba(235, 235, 245, 0.7);
        --label-3: rgba(235, 235, 245, 0.42);
        --separator: rgba(84, 84, 88, 0.55);
        --fill: rgba(118, 118, 128, 0.26);
        --fill-2: rgba(118, 118, 128, 0.14);
        --accent: #2997ff;
        --accent-pressed: #1a7fe0;
        --accent-tint: rgba(41, 151, 255, 0.18);
        --selection: #0a63c9;
        --danger: #ff6961;
        --code-bg: #1f1f22;
        --material: rgba(22, 22, 23, 0.72);
        --material-float: rgba(44, 44, 46, 0.68);
        --material-edge: rgba(255, 255, 255, 0.09);
        --scrim: rgba(0, 0, 0, 0.45);
        --shadow-float: 0 12px 40px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.3);
        --shadow-chip: none;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 100%; -webkit-text-size-adjust: 100%; }

    body {
      font: 400 1rem/1.5 var(--font);
      font-optical-sizing: auto;
      color: var(--label);
      background: var(--bg);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button, textarea { font: inherit; color: inherit; }
    button { background: none; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }

    :focus-visible { outline: 3px solid var(--accent-tint); outline-offset: 2px; border-radius: var(--radius-s); }

    .icon { width: 1em; height: 1em; flex-shrink: 0; }

    /* Respuesta inmediata al presionar: la retroalimentación vive en pointer-down */
    .pressable { transition: transform var(--spring-dur) var(--spring), background-color 160ms ease, color 160ms ease, opacity 160ms ease; }
    .pressable:active { transform: scale(0.96); transition-duration: var(--press); transition-timing-function: ease-out; }

    /* ---------- Barra lateral ---------- */
    aside {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--separator);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      padding: 1rem 0.75rem 0.75rem;
      gap: 1rem;
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.25rem 0.5rem;
    }

    .brand-logo {
      width: 2rem;
      height: 2rem;
      border-radius: 0.5rem;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--fill);
      box-shadow: var(--shadow-chip);
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .brand-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .brand-name { font-size: 0.9375rem; font-weight: 650; letter-spacing: -0.01em; line-height: 1.2; }
    .brand-sub { font-size: 0.75rem; color: var(--label-2); letter-spacing: 0.005em; line-height: 1.3; }

    .btn-new {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.625rem;
      border-radius: var(--radius-s);
      color: var(--accent);
      font-size: 0.875rem;
      font-weight: 590;
    }
    .btn-new:hover { background: var(--fill-2); }
    .btn-new .icon { font-size: 1.125rem; }

    .section-head {
      font-size: 0.6875rem;
      font-weight: 650;
      color: var(--label-3);
      letter-spacing: 0.02em;
      padding: 0 0.625rem;
      margin-bottom: 0.25rem;
    }

    .history {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1px;
      margin: 0 -0.25rem;
      padding: 0 0.25rem;
    }

    .history-empty { font-size: 0.8125rem; color: var(--label-3); padding: 0.375rem 0.625rem; }

    .history-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      border-radius: var(--radius-s);
      font-size: 0.8125rem;
      letter-spacing: 0.005em;
    }
    .history-item:hover { background: var(--fill-2); }
    .history-item.active { background: var(--selection); color: var(--on-accent); }

    .history-open {
      flex: 1;
      min-width: 0;
      text-align: left;
      padding: 0.4375rem 0.625rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-radius: var(--radius-s);
    }

    .history-del {
      width: 1.5rem;
      height: 1.5rem;
      margin-right: 0.25rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--label-2);
      opacity: 0;
    }
    .history-item:hover .history-del, .history-del:focus-visible { opacity: 1; }
    .history-del:hover { background: var(--fill); color: var(--danger); }
    .history-item.active .history-del { color: var(--on-accent); }
    .history-item.active .history-del:hover { background: rgba(255, 255, 255, 0.2); color: var(--on-accent); }

    .sources-filter { border-top: 1px solid var(--separator); padding-top: 0.875rem; }

    .chips { display: flex; flex-wrap: wrap; gap: 0.375rem; padding: 0.25rem 0.5rem 0; }

    .chip {
      padding: 0.25rem 0.625rem;
      border-radius: 999px;
      background: var(--fill);
      font-size: 0.75rem;
      font-weight: 510;
      letter-spacing: 0.005em;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chip:hover { background: var(--fill-2); box-shadow: inset 0 0 0 1px var(--separator); }
    .chip[aria-pressed="true"] { background: var(--selection); color: var(--on-accent); box-shadow: none; }

    /* ---------- Contenido ---------- */
    main {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* Barra superior flotante: material translúcido con el contenido debajo */
    .topbar {
      position: absolute;
      inset: 0 0 auto 0;
      height: 3.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0 1rem;
      z-index: 10;
      background: transparent;
      transition: background-color 200ms ease, box-shadow 200ms ease, backdrop-filter 200ms ease;
    }
    /* Efecto de borde de desplazamiento: el material aparece sólo si hay contenido debajo */
    .topbar.scrolled {
      background: var(--material);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 1px 0 var(--separator);
    }

    .topbar-title {
      flex: 1;
      min-width: 0;
      text-align: center;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: -0.003em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 200ms ease, transform var(--spring-dur) var(--spring);
    }
    .topbar.scrolled .topbar-title { opacity: 1; transform: none; }

    .icon-btn {
      width: 2rem;
      height: 2rem;
      border-radius: var(--radius-s);
      display: grid;
      place-items: center;
      color: var(--label-2);
      font-size: 1.125rem;
    }
    .icon-btn:hover { background: var(--fill-2); color: var(--label); }

    #btn-sidebar { display: none; }
    .topbar-spacer { width: 2rem; flex-shrink: 0; }

    .scroll {
      flex: 1;
      overflow-y: auto;
      scroll-padding-top: 4rem;
      padding: 4.5rem 1.5rem 9rem;
    }

    .thread {
      max-width: var(--content-w);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 3rem;
    }

    /* Bienvenida */
    .welcome {
      min-height: calc(100dvh - 16rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.875rem;
      animation: materialize var(--spring-dur) var(--spring) both;
    }
    .welcome h1 {
      font-size: clamp(2rem, 4.2vw, 2.75rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.028em;
      text-wrap: balance;
    }
    .welcome p {
      font-size: 1.0625rem;
      line-height: 1.5;
      color: var(--label-2);
      max-width: 34rem;
      text-wrap: pretty;
    }
    .privacy {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.8125rem;
      color: var(--label-3);
      margin-top: 0.25rem;
    }

    /* Entradas */
    .entry {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      animation: materialize var(--spring-dur) var(--spring) both;
    }

    @keyframes materialize {
      from { opacity: 0; transform: translateY(8px) scale(0.995); filter: blur(4px); }
      to { opacity: 1; transform: none; filter: none; }
    }

    .entry-meta { font-size: 0.75rem; color: var(--label-3); letter-spacing: 0.01em; }

    .entry-q {
      font-size: 1.625rem;
      font-weight: 680;
      line-height: 1.18;
      letter-spacing: -0.022em;
      text-wrap: balance;
      word-break: break-word;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9375rem;
      color: var(--label-2);
    }
    .status-text {
      background: linear-gradient(90deg, var(--label-2) 0%, var(--label-2) 40%, var(--label-3) 50%, var(--label-2) 60%, var(--label-2) 100%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 1.6s linear infinite;
    }
    @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }

    .spinner {
      width: 0.875rem;
      height: 0.875rem;
      border-radius: 50%;
      border: 2px solid var(--fill);
      border-top-color: var(--label-2);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(1turn); } }

    /* Respuesta (Markdown) */
    .answer {
      font-size: 1rem;
      line-height: 1.65;
      letter-spacing: -0.003em;
      text-wrap: pretty;
      word-break: break-word;
    }
    .answer > * + * { margin-top: 0.875rem; }
    .answer h1, .answer h2, .answer h3, .answer h4 {
      font-weight: 650;
      line-height: 1.25;
      margin-top: 1.5rem;
    }
    .answer h1 { font-size: 1.375rem; letter-spacing: -0.018em; }
    .answer h2 { font-size: 1.25rem; letter-spacing: -0.015em; }
    .answer h3 { font-size: 1.0625rem; letter-spacing: -0.008em; }
    .answer h4 { font-size: 1rem; }
    .answer ul, .answer ol { padding-left: 1.375rem; }
    .answer li + li { margin-top: 0.375rem; }
    .answer li > ul, .answer li > ol { margin-top: 0.375rem; }
    .answer a { color: var(--accent); text-decoration: none; }
    .answer a:hover { text-decoration: underline; }
    .answer strong { font-weight: 650; }
    .answer hr { border: none; height: 1px; background: var(--separator); }
    .answer blockquote {
      padding: 0.25rem 0 0.25rem 1rem;
      border-left: 3px solid var(--separator);
      color: var(--label-2);
    }
    .answer :not(pre) > code {
      font-family: var(--font-mono);
      font-size: 0.875em;
      background: var(--fill-2);
      padding: 0.1em 0.375em;
      border-radius: 0.375rem;
    }
    .answer table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9375rem;
      display: block;
      overflow-x: auto;
    }
    .answer th, .answer td {
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--separator);
      vertical-align: top;
    }
    .answer th { font-weight: 600; font-size: 0.8125rem; color: var(--label-2); letter-spacing: 0.01em; }

    .code {
      border-radius: var(--radius-m);
      background: var(--code-bg);
      box-shadow: inset 0 0 0 1px var(--separator);
      overflow: hidden;
    }
    .code-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.375rem 0.5rem 0.375rem 0.875rem;
      font-size: 0.75rem;
      color: var(--label-3);
      letter-spacing: 0.01em;
    }
    .code pre {
      margin: 0;
      padding: 0.25rem 0.875rem 0.875rem;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      line-height: 1.6;
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.3125rem 0.625rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 510;
      color: var(--label-2);
    }
    .btn-ghost:hover { background: var(--fill); color: var(--label); }
    .btn-ghost.done { color: var(--accent); }

    /* Cursor de escritura: pulso suave */
    .writing::after {
      content: "";
      display: inline-block;
      width: 0.5em;
      height: 0.5em;
      margin-left: 0.25em;
      border-radius: 50%;
      background: var(--label);
      vertical-align: middle;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }

    .entry-actions { display: flex; gap: 0.25rem; margin-left: -0.625rem; }

    .notice { font-size: 0.9375rem; color: var(--label-2); }
    .notice.error { color: var(--danger); }

    /* Fuentes (desplegable) */
    .sources {
      border-radius: var(--radius-m);
      background: var(--fill-2);
    }
    .sources-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 0.875rem;
      border-radius: var(--radius-m);
      font-size: 0.8125rem;
      font-weight: 590;
      color: var(--label-2);
      text-align: left;
    }
    .sources-toggle:hover { color: var(--label); }
    .chev { transition: transform var(--spring-dur) var(--spring); }
    .sources.open .chev { transform: rotate(90deg); }

    .sources-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows var(--spring-dur) var(--spring);
    }
    .sources.open .sources-body { grid-template-rows: 1fr; }
    .sources-inner { overflow: hidden; }
    .sources-list { list-style: none; padding: 0 0.5rem 0.5rem; display: flex; flex-direction: column; gap: 1px; }

    .src {
      display: grid;
      grid-template-columns: 1.375rem 1fr auto;
      gap: 0.5rem;
      align-items: baseline;
      padding: 0.4375rem 0.375rem;
      border-radius: var(--radius-s);
      font-size: 0.8125rem;
    }
    .src-n { font-variant-numeric: tabular-nums; color: var(--label-3); font-weight: 600; text-align: right; }
    .src-main { min-width: 0; }
    .src-file { font-weight: 590; word-break: break-word; }
    .src-dir { display: block; color: var(--label-3); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .src-loc { color: var(--label-2); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 0.75rem; }

    /* ---------- Compositor flotante ---------- */
    .composer-wrap {
      position: absolute;
      inset: auto 0 0 0;
      padding: 0 1.5rem 1.25rem;
      pointer-events: none;
      z-index: 10;
    }
    .composer {
      pointer-events: auto;
      max-width: var(--content-w);
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      padding: 0.5rem 0.5rem 0.5rem 1.125rem;
      border-radius: 1.625rem;
      background: var(--material-float);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      box-shadow: var(--shadow-float), inset 0 1px 0 var(--material-edge), inset 0 0 0 1px var(--separator);
      transition: box-shadow 200ms ease;
    }
    .composer:focus-within { box-shadow: var(--shadow-float), inset 0 1px 0 var(--material-edge), inset 0 0 0 1px var(--accent); }

    .composer-scope {
      align-self: center;
      display: none;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.375rem 0.25rem 0.625rem;
      border-radius: 999px;
      background: var(--accent-tint);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 590;
      white-space: nowrap;
      max-width: 40%;
    }
    .composer-scope.on { display: inline-flex; }
    .composer-scope span { overflow: hidden; text-overflow: ellipsis; }
    .composer-scope button { width: 1.125rem; height: 1.125rem; border-radius: 50%; display: grid; place-items: center; color: inherit; }
    .composer-scope button:hover { background: var(--accent-tint); }

    .composer textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      font-size: 1rem;
      line-height: 1.5;
      padding: 0.5rem 0;
      max-height: 12rem;
      color: var(--label);
    }
    .composer textarea::placeholder { color: var(--label-3); }

    .btn-send {
      width: 2.375rem;
      height: 2.375rem;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      display: grid;
      place-items: center;
      font-size: 1.125rem;
      flex-shrink: 0;
    }
    .btn-send:hover { background: var(--accent-pressed); }
    .btn-send:disabled { opacity: 0.3; cursor: default; transform: none; }
    .btn-send .i-stop { display: none; }
    .btn-send.stop { background: var(--label); color: var(--bg); }
    .btn-send.stop .i-send { display: none; }
    .btn-send.stop .i-stop { display: block; }

    .composer-hint {
      max-width: var(--content-w);
      margin: 0.5rem auto 0;
      text-align: center;
      font-size: 0.6875rem;
      color: var(--label-3);
      letter-spacing: 0.01em;
    }

    /* ---------- Aviso con deshacer ---------- */
    .toast {
      position: absolute;
      left: 50%;
      bottom: 7.5rem;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.5rem 0.5rem 1rem;
      border-radius: 999px;
      background: var(--material-float);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      box-shadow: var(--shadow-float), inset 0 0 0 1px var(--separator);
      font-size: 0.8125rem;
      font-weight: 510;
      /* Entra y sale por el mismo camino */
      transform: translate(-50%, 1rem) scale(0.96);
      opacity: 0;
      pointer-events: none;
      transition: transform var(--spring-dur) var(--spring), opacity 180ms ease;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
    .toast button { color: var(--accent); font-weight: 650; padding: 0.25rem 0.75rem; border-radius: 999px; }
    .toast button:hover { background: var(--accent-tint); }

    .scrim { display: none; }

    /* ---------- Ventanas angostas: la barra lateral pasa a ser una hoja ---------- */
    @media (max-width: 52rem) {
      aside {
        position: fixed;
        inset: 0 auto 0 0;
        box-shadow: var(--shadow-float);
        transform: translateX(-105%);
        transition: transform var(--spring-dur) var(--spring);
      }
      body.sidebar-open aside { transform: none; }
      .scrim {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 25;
        background: var(--scrim);
        opacity: 0;
        pointer-events: none;
        transition: opacity 240ms ease;
      }
      body.sidebar-open .scrim { opacity: 1; pointer-events: auto; }
      #btn-sidebar { display: grid; }
      .scroll { padding-left: 1rem; padding-right: 1rem; }
      .composer-wrap { padding: 0 0.75rem 0.75rem; }
      .composer-hint { display: none; }
      .entry-q { font-size: 1.375rem; }
    }

    /* ---------- Accesibilidad ---------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 120ms !important;
        transition-timing-function: ease !important;
      }
      .pressable:active { transform: none; }
      .welcome, .entry { animation: fade 200ms ease both !important; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      .status-text { animation: none !important; color: var(--label-2); background: none; }
      .writing::after { animation: none !important; opacity: 0.6; }
      aside, .toast { transition-property: opacity !important; }
    }

    @media (prefers-reduced-transparency: reduce) {
      .topbar.scrolled, .composer, .toast {
        background: var(--bg-elevated);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
    }

    @media (prefers-contrast: more) {
      :root { --separator: rgba(60, 60, 67, 0.5); --label-2: var(--label); --label-3: rgba(60, 60, 67, 0.8); }
      .composer, .toast, .sources, .chip { box-shadow: inset 0 0 0 1px var(--label); }
    }
  </style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-compose" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V12"/><path d="M18.4 3.6a1.9 1.9 0 0 1 2.7 2.7L12.5 15 9 16l1-3.5z"/></symbol>
      <symbol id="i-sidebar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5.5 11.5 6.5-6.5 6.5 6.5"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6a2.5 2.5 0 0 0-2.5-2.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3.5H7.5A2 2 0 0 0 5.5 5.5v13a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z"/><path d="M14 3.5V8h4.5"/></symbol>
    </defs>
  </svg>

  <aside id="sidebar" aria-label="Conversaciones">
    <div class="brand">
      <div class="brand-logo" id="brand-logo">
        <img src="/static/logo.png" alt="" onerror="this.remove(); document.getElementById('brand-logo').textContent='A';">
      </div>
      <div>
        <div class="brand-name">Tu Archivo</div>
        <div class="brand-sub">Privado · en tu homelab</div>
      </div>
    </div>

    <button class="btn-new pressable" id="btn-new" type="button">
      <svg class="icon"><use href="#i-compose"/></svg>
      Nueva conversación
    </button>

    <div class="history" id="history" role="list"></div>

    <div class="sources-filter">
      <div class="section-head" id="filter-label">Buscar en</div>
      <div class="chips" id="chips" role="group" aria-labelledby="filter-label"></div>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main>
    <header class="topbar" id="topbar">
      <button class="icon-btn pressable" id="btn-sidebar" type="button" aria-label="Mostrar conversaciones" aria-controls="sidebar" aria-expanded="false">
        <svg class="icon"><use href="#i-sidebar"/></svg>
      </button>
      <div class="topbar-spacer"></div>
      <div class="topbar-title" id="topbar-title"></div>
      <div class="topbar-spacer"></div>
    </header>

    <div class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <div class="composer-scope" id="scope">
          <span id="scope-name"></span>
          <button type="button" id="scope-clear" aria-label="Buscar en todas las fuentes">
            <svg class="icon" style="font-size:.75rem"><use href="#i-x"/></svg>
          </button>
        </div>
        <textarea id="input" rows="1" placeholder="Pregunta a tus documentos" aria-label="Pregunta" autofocus></textarea>
        <button class="btn-send pressable" id="btn-send" type="submit" aria-label="Enviar" disabled>
          <svg class="icon i-send"><use href="#i-arrow-up"/></svg>
          <svg class="icon i-stop"><use href="#i-stop"/></svg>
        </button>
      </form>
      <div class="composer-hint">Enter para enviar · Shift + Enter para nueva línea</div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <span id="toast-text"></span>
      <button type="button" id="toast-undo">Deshacer</button>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "tu_archivo_convs";
    const ALL = "(Todos)";

    const state = {
      conversations: [],   // [{ id, title, timestamp, entries: [{ id, question, answer, sources, timestamp }] }]
      activeId: null,
      folder: ALL,
      controller: null,    // AbortController de la respuesta en curso
    };

    const $ = (id) => document.getElementById(id);
    const els = {
      history: $("history"), chips: $("chips"), thread: $("thread"), scroll: $("scroll"),
      topbar: $("topbar"), topbarTitle: $("topbar-title"), input: $("input"), send: $("btn-send"),
      composer: $("composer"), scope: $("scope"), scopeName: $("scope-name"), toast: $("toast"),
      toastText: $("toast-text"),
    };

    const icon = (name, cls = "icon") => `<svg class="${cls}"><use href="#i-${name}"/></svg>`;

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>'"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[c]));
    }

    // ---------- Persistencia ----------
    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.conversations)); } catch (e) { /* almacenamiento no disponible */ }
    }

    function load() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        // Migrar el formato antiguo (una pregunta por conversación)
        state.conversations = parsed.map((c) => c.entries ? c : {
          id: c.id, title: c.question, timestamp: c.timestamp,
          entries: [{ id: "e-" + c.id, question: c.question, answer: c.answer, sources: c.sources || [], timestamp: c.timestamp }],
        });
      } catch (e) {
        state.conversations = [];
      }
    }

    const activeConv = () => state.conversations.find((c) => c.id === state.activeId);

    // ---------- Barra lateral ----------
    function renderHistory() {
      els.history.innerHTML = "";
      if (!state.conversations.length) {
        els.history.innerHTML = `<div class="history-empty">Tus conversaciones aparecerán aquí.</div>`;
        return;
      }
      const head = document.createElement("div");
      head.className = "section-head";
      head.textContent = "Recientes";
      els.history.appendChild(head);

      for (const conv of state.conversations) {
        const row = document.createElement("div");
        row.className = "history-item" + (conv.id === state.activeId ? " active" : "");
        row.setAttribute("role", "listitem");

        const open = document.createElement("button");
        open.type = "button";
        open.className = "history-open";
        open.textContent = conv.title || "Nueva conversación";
        open.title = conv.title || "";
        if (conv.id === state.activeId) open.setAttribute("aria-current", "page");
        open.addEventListener("click", () => { openConversation(conv.id); closeSidebar(); });

        const del = document.createElement("button");
        del.type = "button";
        del.className = "history-del";
        del.setAttribute("aria-label", "Eliminar conversación");
        del.innerHTML = icon("x");
        del.addEventListener("click", () => deleteConversation(conv.id));

        row.append(open, del);
        els.history.appendChild(row);
      }
    }

    async function loadSources() {
      let sources = [];
      try {
        const res = await fetch("/api/sources");
        sources = ((await res.json()).sources || []).filter((s) => s !== ALL);
      } catch (e) {
        console.error("Error cargando fuentes:", e);
      }
      renderChips(sources);
    }

    function renderChips(sources) {
      els.chips.innerHTML = "";
      for (const src of [ALL, ...sources]) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip pressable";
        chip.textContent = src === ALL ? "Todo" : src;
        chip.title = src === ALL ? "Todas las fuentes" : src;
        chip.dataset.source = src;
        chip.setAttribute("aria-pressed", String(src === state.folder));
        chip.addEventListener("click", () => setFolder(src));
        els.chips.appendChild(chip);
      }
    }

    function setFolder(folder) {
      state.folder = folder;
      for (const chip of els.chips.children) chip.setAttribute("aria-pressed", String(chip.dataset.source === folder));
      // El filtro se muestra junto al campo que afecta
      els.scope.classList.toggle("on", folder !== ALL);
      els.scopeName.textContent = folder;
      els.scope.title = `Buscando sólo en ${folder}`;
    }

    // Hoja lateral en ventanas angostas
    function openSidebar() {
      document.body.classList.add("sidebar-open");
      $("btn-sidebar").setAttribute("aria-expanded", "true");
    }
    function closeSidebar() {
      document.body.classList.remove("sidebar-open");
      $("btn-sidebar").setAttribute("aria-expanded", "false");
    }

    // ---------- Markdown ----------
    function renderMarkdown(raw) {
      if (!raw) return "";
      let html;
      try {
        html = window.marked ? marked.parse(raw, { breaks: true, gfm: true }) : escapeHtml(raw);
      } catch (e) {
        html = escapeHtml(raw);
      }
      // El texto viene del LLM y de tus documentos: se limpia antes de insertarlo
      return window.DOMPurify ? DOMPurify.sanitize(html) : escapeHtml(raw);
    }

    function enhanceCode(root) {
      for (const pre of root.querySelectorAll("pre")) {
        if (pre.parentElement.classList.contains("code")) continue;
        const code = pre.querySelector("code");
        const lang = (code?.className.match(/language-([\w+-]+)/) || [])[1] || "código";
        const wrap = document.createElement("div");
        wrap.className = "code";
        const head = document.createElement("div");
        head.className = "code-head";
        head.innerHTML = `<span>${escapeHtml(lang)}</span>`;
        head.appendChild(copyButton(() => (code || pre).innerText, "Copiar"));
        pre.replaceWith(wrap);
        wrap.append(head, pre);
      }
    }

    function copyButton(getText, label) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn-ghost pressable";
      const idle = `${icon("copy")}<span>${label}</span>`;
      btn.innerHTML = idle;
      btn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(getText());
          btn.classList.add("done");
          btn.innerHTML = `${icon("check")}<span>Copiado</span>`;
          setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = idle; }, 1600);
        } catch (e) {
          console.error("No se pudo copiar:", e);
        }
      });
      return btn;
    }

    // ---------- Hilo ----------
    function renderWelcome() {
      els.thread.innerHTML = `
        <section class="welcome">
          <h1>¿Qué quieres consultar?</h1>
          <p>Pregunta sobre tus apuntes, documentos y repositorios. Las respuestas citan las fuentes de donde salen.</p>
          <span class="privacy">${icon("lock")} Todo se procesa en tu servidor. Nada sale de tu red.</span>
        </section>`;
      els.topbarTitle.textContent = "";
    }

    function splitPath(path) {
      const parts = String(path || "?").split("/");
      return { file: parts.pop(), dir: parts.join(" / ") };
    }

    function renderSources(container, sources, open = false) {
      container.innerHTML = "";
      if (!sources?.length) return;
      const box = document.createElement("div");
      box.className = "sources" + (open ? " open" : "");
      const n = sources.length;
      box.innerHTML = `
        <button type="button" class="sources-toggle" aria-expanded="${open}">
          ${icon("chev", "icon chev")}
          ${n} ${n === 1 ? "fuente" : "fuentes"}
        </button>
        <div class="sources-body"><div class="sources-inner">
          <ol class="sources-list">
            ${sources.map((s, i) => {
              const { file, dir } = splitPath(s.path);
              return `
                <li class="src" title="${escapeHtml(s.path)} · relevancia ${escapeHtml(s.score)}">
                  <span class="src-n">${i + 1}</span>
                  <span class="src-main">
                    <span class="src-file">${escapeHtml(file)}</span>
                    ${dir ? `<span class="src-dir">${escapeHtml(dir)}</span>` : ""}
                  </span>
                  <span class="src-loc">${escapeHtml(s.detail || "")}</span>
                </li>`;
            }).join("")}
          </ol>
        </div></div>`;
      const toggle = box.querySelector(".sources-toggle");
      toggle.addEventListener("click", () => {
        const isOpen = box.classList.toggle("open");
        toggle.setAttribute("aria-expanded", String(isOpen));
      });
      container.appendChild(box);
    }

    function entryElement(entry) {
      const el = document.createElement("article");
      el.className = "entry";
      el.innerHTML = `
        <div class="entry-meta">${escapeHtml(entry.timestamp || "")}</div>
        <h2 class="entry-q"></h2>
        <div class="entry-status"></div>
        <div class="answer"></div>
        <div class="entry-actions"></div>
        <div class="entry-sources"></div>`;
      el.querySelector(".entry-q").textContent = entry.question;
      return el;
    }

    function finishEntry(el, entry) {
      const answer = el.querySelector(".answer");
      answer.classList.remove("writing");
      answer.innerHTML = renderMarkdown(entry.answer);
      enhanceCode(answer);
      el.querySelector(".entry-status").innerHTML = "";
      const actions = el.querySelector(".entry-actions");
      actions.innerHTML = "";
      if (entry.answer) actions.appendChild(copyButton(() => entry.answer, "Copiar respuesta"));
      renderSources(el.querySelector(".entry-sources"), entry.sources);
    }

    function openConversation(id) {
      if (state.controller) return;
      state.activeId = id;
      renderHistory();
      const conv = activeConv();
      if (!conv) return renderWelcome();
      els.thread.innerHTML = "";
      for (const entry of conv.entries) {
        const el = entryElement(entry);
        els.thread.appendChild(el);
        finishEntry(el, entry);
      }
      els.topbarTitle.textContent = conv.title || "";
      els.scroll.scrollTop = els.scroll.scrollHeight;
      updateTopbar();
      els.input.focus();
    }

    function newConversation() {
      if (state.controller) return;
      state.activeId = null;
      renderHistory();
      renderWelcome();
      els.input.value = "";
      autosize();
      closeSidebar();
      els.input.focus();
    }

    // Borrar con deshacer en lugar de pedir confirmación
    let undo = null;
    function deleteConversation(id) {
      if (state.controller) return;
      const index = state.conversations.findIndex((c) => c.id === id);
      if (index < 0) return;
      const [removed] = state.conversations.splice(index, 1);
      save();
      if (state.activeId === id) {
        state.conversations.length ? openConversation(state.conversations[0].id) : newConversation();
      } else {
        renderHistory();
      }
      clearTimeout(undo?.timer);
      undo = { conv: removed, index, timer: setTimeout(hideToast, 5000) };
      els.toastText.textContent = "Conversación eliminada";
      els.toast.classList.add("show");
    }
    function hideToast() {
      els.toast.classList.remove("show");
      undo = null;
    }
    $("toast-undo").addEventListener("click", () => {
      if (!undo) return;
      clearTimeout(undo.timer);
      state.conversations.splice(undo.index, 0, undo.conv);
      save();
      const id = undo.conv.id;
      hideToast();
      openConversation(id);
    });

    // ---------- Desplazamiento ----------
    const nearBottom = () => els.scroll.scrollHeight - els.scroll.scrollTop - els.scroll.clientHeight < 120;
    function updateTopbar() {
      els.topbar.classList.toggle("scrolled", els.scroll.scrollTop > 4);
    }
    els.scroll.addEventListener("scroll", updateTopbar, { passive: true });

    // ---------- Compositor ----------
    function autosize() {
      els.input.style.height = "auto";
      els.input.style.height = Math.min(els.input.scrollHeight, 192) + "px";
      if (!state.controller) els.send.disabled = !els.input.value.trim();
    }
    els.input.addEventListener("input", autosize);
    els.input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        // Durante una respuesta, Enter no la detiene: eso sólo lo hace el botón
        if (!state.controller) els.composer.requestSubmit();
      }
    });

    function setStreaming(controller) {
      state.controller = controller;
      els.send.classList.toggle("stop", !!controller);
      els.send.setAttribute("aria-label", controller ? "Detener respuesta" : "Enviar");
      els.send.disabled = controller ? false : !els.input.value.trim();
    }

    function setStatus(el, text) {
      el.querySelector(".entry-status").innerHTML = text
        ? `<span class="status"><span class="spinner"></span><span class="status-text">${escapeHtml(text)}</span></span>`
        : "";
    }

    els.composer.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (state.controller) { state.controller.abort(); return; }

      const question = els.input.value.trim();
      if (!question) return;
      els.input.value = "";
      autosize();

      const timestamp = new Date().toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
      let conv = activeConv();
      if (!conv) {
        conv = { id: "conv-" + Date.now(), title: question, timestamp, entries: [] };
        state.conversations.unshift(conv);
        state.activeId = conv.id;
        els.thread.innerHTML = "";
        els.topbarTitle.textContent = question;
      }

      // Historial previo como contexto para el modelo
      const messages = conv.entries.flatMap((it) => [
        { role: "user", content: it.question },
        { role: "assistant", content: it.answer || "" },
      ]);

      const entry = { id: "e-" + Date.now(), question, answer: "", sources: [], timestamp };
      conv.entries.push(entry);
      renderHistory();

      const el = entryElement(entry);
      els.thread.appendChild(el);
      el.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });

      const answerEl = el.querySelector(".answer");
      setStatus(el, "Buscando en tus documentos");

      const controller = new AbortController();
      setStreaming(controller);

      // Renderizar como mucho una vez por cuadro aunque lleguen muchos tokens
      let frame = 0;
      const scheduleRender = () => {
        if (frame) return;
        frame = requestAnimationFrame(() => {
          frame = 0;
          const follow = nearBottom();
          answerEl.innerHTML = renderMarkdown(entry.answer);
          enhanceCode(answerEl);
          if (follow) els.scroll.scrollTop = els.scroll.scrollHeight;
        });
      };

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, source: state.folder === ALL ? null : state.folder, top_k: 7, messages }),
          signal: controller.signal,
        });
        if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split("\n\n");
          buffer = events.pop();
          for (const ev of events) {
            if (!ev.startsWith("data: ")) continue;
            const data = JSON.parse(ev.slice(6));
            if (data.type === "sources") {
              entry.sources = data.sources || [];
              const n = entry.sources.length;
              setStatus(el, n ? `Leyendo ${n} ${n === 1 ? "fuente" : "fuentes"}` : "Redactando");
            } else if (data.type === "token") {
              if (!entry.answer) { setStatus(el, ""); answerEl.classList.add("writing"); }
              entry.answer += data.text;
              scheduleRender();
            }
          }
        }
      } catch (err) {
        if (err.name !== "AbortError") {
          console.error(err);
          entry.error = true;
        }
      } finally {
        cancelAnimationFrame(frame);
        setStreaming(null);
        finishEntry(el, entry);
        if (entry.error) {
          el.querySelector(".entry-status").innerHTML = `<p class="notice error">No se pudo conectar con el servidor. Revisa que el túnel y el backend estén activos.</p>`;
          delete entry.error;
        } else if (controller.signal.aborted) {
          el.querySelector(".entry-status").innerHTML = `<p class="notice">Respuesta detenida.</p>`;
        }
        save();
        els.input.focus();
      }
    });

    // ---------- Arranque ----------
    $("btn-new").addEventListener("click", newConversation);
    $("btn-sidebar").addEventListener("click", openSidebar);
    $("scrim").addEventListener("click", closeSidebar);
    $("scope-clear").addEventListener("click", () => setFolder(ALL));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSidebar(); });

    load();
    renderChips([]);
    loadSources();
    if (state.conversations.length) openConversation(state.conversations[0].id);
    else { renderHistory(); renderWelcome(); }
    autosize();
  </script>
</body>
</html>
