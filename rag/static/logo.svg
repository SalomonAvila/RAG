<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo: el mismo azul de acento de la interfaz -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ba6ff"/>
      <stop offset="1" stop-color="#0066e0"/>
    </linearGradient>
    <!-- Brillo superior sutil, como luz sobre el material -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00337a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#sheen)"/>

  <!-- Pila de documentos -->
  <g filter="url(#lift)">
    <rect x="134" y="124" width="196" height="252" rx="30" fill="#ffffff" opacity="0.4" transform="rotate(-9 232 250)"/>
    <rect x="160" y="112" width="204" height="262" rx="32" fill="url(#paper)"/>
  </g>

  <!-- Líneas de texto -->
  <g fill="#0066e0" opacity="0.28">
    <rect x="196" y="160" width="132" height="18" rx="9"/>
    <rect x="196" y="196" width="132" height="18" rx="9"/>
    <rect x="196" y="232" width="84" height="18" rx="9"/>
  </g>

  <!-- Lupa: buscar en tu archivo -->
  <g filter="url(#lift)">
    <line x1="352" y1="352" x2="398" y2="398" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
    <circle cx="316" cy="316" r="64" fill="#0a74ef" stroke="#ffffff" stroke-width="22"/>
  </g>
  <circle cx="316" cy="316" r="53" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M286 300 a 34 34 0 0 1 30 -18" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="10" stroke-linecap="round"/>
</svg>
